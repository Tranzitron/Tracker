name: tracker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  quiver: ^3.2.2
  hydrated_bloc: ^11.0.0
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: any

# path_provider_android 2.3.x depends on package:jni 1.0.x, whose JList/JMap
# extension-type wrappers fail to compile in Flutter builds (dart-lang/native
# issue #3235; no fixed release exists as of jni 1.0.3). Pin to the pre-jni
# 2.2.x line (MethodChannel-based) to keep the broken packages out of the build.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

flutter:
  uses-material-design: true