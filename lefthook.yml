pre-commit:
  commands:
    flutter_lint_code:
      root: "tracker/"
      glob: "*.dart"
      exclude: "*.{g,freezed}.dart"
      run: |
        for file in {staged_files}; do
          dart fix --apply "$file"
        done
      stage_fixed: true
    prettify:
      root: "tracker/"
      glob: "*.dart"
      exclude: "*.{g,freezed}.dart"
      run: dart format --line-length 120 {staged_files}
      stage_fixed: true